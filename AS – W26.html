<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Escala Tipográfica Fluida</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
    }

    h2 {
      font-size: calc(1.5rem + 3vw);
    }

    h3 {
      font-size: 2.5vw;
    }
  </style>
</head>

<body>
  <h1>Título Principal (H1)</h1>
  <h2>Subtítulo (H2)</h2>
  <h3>Título Menor (H3)</h3>

  <p>
    Redimensione a janela do navegador para ver os títulos se ajustarem
    dinamicamente ao tamanho da tela.
  </p>
</body>
</html>
